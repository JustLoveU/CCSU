name: minato-reservation

on:
  schedule:
    # JST 05:05 / 05:25 / 05:45
    # - cron: "5,25,45 20 * * *"
    # JST 05:25 / 06:25 / 07:25 / 08:25
    - cron: "25 20-23 * * *"
    # JST 09:25〜22:25（1時間おき）
    - cron: "25 0-13 * * *"
    # JST 23:05 / 23:25 / 23:45
    - cron: "5,25,45 14 * * *"
  workflow_dispatch: # 手動実行ボタン

env:
  TZ: Asia/Tokyo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reserve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv

      - name: Run reservation bot
        env:
          RSV_USER_ID: ${{ secrets.MINATO_USER_ID }}
          RSV_PASSWORD: ${{ secrets.MINATO_PASSWORD }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python minato_reserve.py

      - name: Upload debug output
        uses: actions/upload-artifact@v4
        # 手動実行時、またはエラー発生時に output フォルダを保存して確認可能にする
        if: always()
        with:
          name: minato-debug-output
          path: output/
          retention-days: 3
