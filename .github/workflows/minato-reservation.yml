name: minato-reservation

on:
  schedule:
    # JST 07:25
    - cron: "25 19 * * *"
  workflow_dispatch: # 手動実行ボタン

env:
  TZ: Asia/Tokyo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reserve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv

      - name: Run reservation bot
        env:
          RSV_USER_ID: ${{ secrets.RSV_USER_ID }}
          RSV_PASSWORD: ${{ secrets.RSV_PASSWORD }}
          MINATO_BASE_URL: ${{ secrets.MINATO_BASE_URL }}
          MINATO_ALL_SCHOOLS: ${{ secrets.MINATO_ALL_SCHOOLS }}
          MINATO_EXCLUDE_SCHOOLS: ${{ secrets.MINATO_EXCLUDE_SCHOOLS }}
          MINATO_PRIORITY_SCHOOLS: ${{ secrets.MINATO_PRIORITY_SCHOOLS }}
          SLACK_TLWEBHOOK_URL: ${{ secrets.TLSLACK_WEBHOOK_URL }}
          
        run: |
          python minato_reserve.py

      - name: Upload debug output
        uses: actions/upload-artifact@v4
        # 手動実行時、またはエラー発生時に output フォルダを保存して確認可能にする
        if: always()
        with:
          name: minato-debug-output
          path: output/
          retention-days: 3
